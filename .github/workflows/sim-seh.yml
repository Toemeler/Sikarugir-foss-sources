# Off-device test loop: Madeira's FEX + ARM64EC-Wine stack built for the iOS
# Simulator (arm64 on the Apple-silicon macos-26 runners), so exception-path
# fixes can be checked without a device.
#
# Every native library is built with MAD_SDK=iphonesimulator (the build scripts
# default to iphoneos, so the release build in build.yml is unchanged). The PE
# side (ntdll.dll and the rest of arm64ec-windows, xtajit64.dll) is
# SDK-independent and is exactly what the release ships, unless
# fex-patches or plan.json "ntdll_builds" say otherwise (below).
#
# One push = one experiment, driven by tests/sim-harness/plan.json: every entry of
# its "variants" is a job of its own (own simulator, in parallel) that runs the
# listed guest command lines and prints a digest (tests/sim-harness/digest.py).
#
#   plan      reads plan.json into the harness matrix.
#   fex-sim   FEXCore static libraries for the simulator SDK (compile check,
#             only with [fex-sim] in the commit message).
#   unix-sim  GnuTLS/FFmpeg/FreeType, Wine's configure, then the ntdll,
#             wineserver and win32u unix sides for the simulator SDK (cached).
#   fex-ec    xtajit64.dll: the release's (its cache entry) or, with patches in
#             tests/sim-harness/fex-patches, built with them on top (ccache).
#   pe-ntdll  one ntdll.dll per plan.json "ntdll_builds" entry: build/wine-pe/patches
#             (all, or the subset it names) plus tests/sim-harness/wine-patches.
#   harness   tests/sim-harness: links them into a headless runner, boots an
#             iPad Pro (M4) simulator and runs one variant in it.

name: Simulator SEH harness

on:
  push:
    branches: [codex/sim-seh-20261022]
  workflow_dispatch:

permissions:
  contents: read

env:
  MAD_SDK: iphonesimulator
  MINGW: llvm-mingw-20260421-ucrt-macos-universal
  MINGW_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  FREETYPE_TAG: VER-2-13-3

concurrency:
  group: sim-seh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      ntdll_matrix: ${{ steps.p.outputs.ntdll_matrix }}
      has_ntdll: ${{ steps.p.outputs.has_ntdll }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/sim-harness
      - id: p
        run: |
          set -euo pipefail
          jq . tests/sim-harness/plan.json
          echo "matrix=$(jq -c '{include: .variants}' tests/sim-harness/plan.json)" >> "$GITHUB_OUTPUT"
          n=$(jq -c '{include: [(.ntdll_builds // {}) | to_entries[] | {key: .key, patches: (.value.patches // null)}]}' tests/sim-harness/plan.json)
          echo "ntdll_matrix=$n" | tee -a "$GITHUB_OUTPUT"
          echo "has_ntdll=$(jq -r 'if (.ntdll_builds // {}) == {} then "false" else "true" end' tests/sim-harness/plan.json)" | tee -a "$GITHUB_OUTPUT"

  fex-sim:
    name: FEXCore (iphonesimulator)
    # A compile check only (the harness does not link FEXCore): commit message [fex-sim].
    if: contains(github.event.head_commit.message, '[fex-sim]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
      - name: FEX source
        run: git submodule update --init --recursive --depth 1 --jobs 4 -- FEX
      - name: "Cache: FEX (sim)"
        uses: actions/cache@v4
        with:
          key: fex-sim-v1-${{ hashFiles('build/fex-ios/build.sh') }}-${{ github.sha }}
          restore-keys: fex-sim-v1-${{ hashFiles('build/fex-ios/build.sh') }}-
          path: |
            FEX/build-ios
            !FEX/build-ios/**/CMakeFiles/**
      - name: Build FEXCore
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          build/fex-ios/build.sh
          for a in $(find FEX/build-ios -name '*.a'); do
            echo "$a: $(xcrun vtool -show-build "$a" 2>/dev/null | grep -m1 platform || true)"
          done

  unix-sim:
    name: Wine unix side (iphonesimulator)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          k() { printf '%s\n' "$@" | shasum -a 256 | cut -c1-20; }
          t() { git rev-parse "HEAD:$1"; }
          echo "libs=unix-sim-v1-$(k "$(t wine)" "$(t build/ntdll-unix)" "$(t build/wineserver)" \
            "$(t build/win32u-unix)" "$(t build/crypto-unix)" "$(t build/madsync)" \
            "$(t build/hidpad)" "$(t build/madeira_cfg.h)" "$(t app/Madeira/Winios)" \
            "$(t build/gnutls-ios)" "$(t build/ffmpeg)" "$(t build/freetype-ios)" "$FREETYPE_TAG" \
            "$(git hash-object .github/scripts/configure_wine.sh)")" | tee -a "$GITHUB_OUTPUT"
      - name: "Cache: simulator unix libraries"
        id: c-libs
        uses: actions/cache@v4
        with:
          key: ${{ steps.key.outputs.libs }}
          path: sim-libs
      - name: Toolchain
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          brew install bison flex gnutls freetype pkgconf
          mkdir -p toolchains
          curl -fsSL --retry 3 -o "toolchains/$MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW.tar.xz"
          echo "$MINGW_SHA256  toolchains/$MINGW.tar.xz" | shasum -a 256 -c -
          tar -xJf "toolchains/$MINGW.tar.xz" -C toolchains
          rm "toolchains/$MINGW.tar.xz"
          git clone -q --depth 1 --branch "$FREETYPE_TAG" https://github.com/freetype/freetype.git research/freetype
      - name: Wine source
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1 --jobs 4 -- wine

      - name: "Cache: GnuTLS (sim)"
        if: steps.c-libs.outputs.cache-hit != 'true'
        id: c-gnutls
        uses: actions/cache/restore@v4
        with:
          key: gnutls-sim-v1-${{ hashFiles('build/gnutls-ios/**') }}
          path: toolchains/gnutls-ios
      - name: GMP, Nettle, GnuTLS
        if: steps.c-libs.outputs.cache-hit != 'true' && steps.c-gnutls.outputs.cache-hit != 'true'
        run: build/gnutls-ios/build.sh > gnutls.log 2>&1 || { tail -80 gnutls.log; exit 1; }
      - name: "Save: GnuTLS (sim)"
        if: steps.c-libs.outputs.cache-hit != 'true' && steps.c-gnutls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: gnutls-sim-v1-${{ hashFiles('build/gnutls-ios/**') }}
          path: toolchains/gnutls-ios
      - name: "Cache: FFmpeg (sim)"
        if: steps.c-libs.outputs.cache-hit != 'true'
        id: c-ffmpeg
        uses: actions/cache/restore@v4
        with:
          key: ffmpeg-sim-v1-${{ hashFiles('build/ffmpeg/**') }}
          path: |
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
      - name: FFmpeg
        if: steps.c-libs.outputs.cache-hit != 'true' && steps.c-ffmpeg.outputs.cache-hit != 'true'
        run: build/ffmpeg/build.sh > ffmpeg.log 2>&1 || { tail -80 ffmpeg.log; exit 1; }
      - name: "Save: FFmpeg (sim)"
        if: steps.c-libs.outputs.cache-hit != 'true' && steps.c-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ffmpeg-sim-v1-${{ hashFiles('build/ffmpeg/**') }}
          path: |
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
      - name: FreeType
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: build/freetype-ios/build.sh > freetype.log 2>&1 || { tail -80 freetype.log; exit 1; }
      - name: Wine (configure)
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: .github/scripts/configure_wine.sh

      - name: ntdll unix side
        if: steps.c-libs.outputs.cache-hit != 'true'
        id: ntdll
        continue-on-error: true
        run: |
          set -o pipefail
          build/ntdll-unix/build.sh 2>&1 | tee ntdll.log || true
          grep -q '^Results: [0-9]* succeeded, 0 failed' ntdll.log && test -s app/Madeira/libntdll_unix.a
      - name: wineserver
        if: steps.c-libs.outputs.cache-hit != 'true'
        id: wineserver
        continue-on-error: true
        run: PATH="$PATH:$PWD/toolchains/$MINGW/bin" build/wineserver/build.sh
      - name: win32u unix side
        if: steps.c-libs.outputs.cache-hit != 'true'
        id: win32u
        continue-on-error: true
        run: |
          set -o pipefail
          build/win32u-unix/build.sh 2>&1 | tee win32u.log || true
          ! grep -q 'FAILED' win32u.log && test -s app/Madeira/libwin32u_unix.a

      - name: Collect logs
        if: always() && steps.c-libs.outputs.cache-hit != 'true'
        run: |
          mkdir -p logs
          cp *.log logs/ 2>/dev/null || true
          for d in ntdll-unix wineserver win32u-unix; do
            mkdir -p "logs/$d"
            find "build/$d/obj" -maxdepth 1 \( -name '*.err' -o -name 'err-*' \) -size +0 \
              -exec cp {} "logs/$d/" \; 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.c-libs.outputs.cache-hit != 'true'
        with:
          name: unix-sim-logs
          path: logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Verdict
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: |
          echo "ntdll: ${{ steps.ntdll.outcome }}  wineserver: ${{ steps.wineserver.outcome }}  win32u: ${{ steps.win32u.outcome }}"
          [ "${{ steps.ntdll.outcome }}" = success ] && [ "${{ steps.wineserver.outcome }}" = success ] \
            && [ "${{ steps.win32u.outcome }}" = success ]
      - name: Stage the libraries
        if: steps.c-libs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p sim-libs/app sim-libs/gnutls
          cp app/Madeira/libntdll_unix.a app/Madeira/libwineserver.a app/Madeira/libwin32u_unix.a \
             app/Madeira/libavformat.a app/Madeira/libavcodec.a app/Madeira/libswresample.a \
             app/Madeira/libavutil.a sim-libs/app/
          cp toolchains/gnutls-ios/lib/*.a sim-libs/gnutls/
          ls -l sim-libs/*
      - uses: actions/upload-artifact@v4
        with:
          name: sim-libs
          path: sim-libs
          if-no-files-found: error
          retention-days: 3

  fex-ec:
    name: xtajit64.dll
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      # Without extra patches the key is the release workflow's (same path), so its entry is used.
      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          k() { printf '%s\n' "$@" | shasum -a 256 | cut -c1-20; }
          t() { git rev-parse "HEAD:$1"; }
          if ls tests/sim-harness/fex-patches/*.patch >/dev/null 2>&1; then
            x=$(cat tests/sim-harness/fex-patches/*.patch | shasum -a 256 | cut -c1-20)
            echo "key=fexec-sim-v1-$(k "$(t FEX)" "$(t build/fex-arm64ec)" "$MINGW" "$x")"
          else
            echo "key=fexec-v1-$(k "$(t FEX)" "$(t build/fex-arm64ec)" "$MINGW")"
          fi | tee -a "$GITHUB_OUTPUT"
      - name: "Cache: xtajit64.dll"
        id: c
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/arm64ec-windows/xtajit64.dll
      - name: Toolchain
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          brew install ninja ccache
          mkdir -p toolchains
          curl -fsSL --retry 3 -o "toolchains/$MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW.tar.xz"
          echo "$MINGW_SHA256  toolchains/$MINGW.tar.xz" | shasum -a 256 -c -
          tar -xJf "toolchains/$MINGW.tar.xz" -C toolchains
          rm "toolchains/$MINGW.tar.xz"
      - name: "Cache: ccache"
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: ccache-fexec-v1-${{ github.sha }}
          restore-keys: ccache-fexec-v1-
          path: .ccache
      - name: Build
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 --jobs 4 -- FEX
          # The extra patches go after build/fex-arm64ec/patches, which build.sh applies in name order.
          for P in tests/sim-harness/fex-patches/*.patch; do
            [ -e "$P" ] && cp "$P" "build/fex-arm64ec/patches/9$(basename "$P")"
          done
          ccache -z
          build/fex-arm64ec/build.sh
          ccache -s
      - name: "Save: ccache"
        if: always() && steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ccache-fexec-v1-${{ github.sha }}
          path: .ccache
      - name: "Save: xtajit64.dll"
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/arm64ec-windows/xtajit64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: xtajit64
          path: app/Madeira/arm64ec-windows/xtajit64.dll
          if-no-files-found: error
          retention-days: 3

  pe-ntdll:
    name: ntdll.dll ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.has_ntdll == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ntdll_matrix) }}
    env:
      KEEP: ${{ toJSON(matrix.patches) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          k() { printf '%s\n' "$@" | shasum -a 256 | cut -c1-20; }
          t() { git rev-parse "HEAD:$1"; }
          x=$( (cat tests/sim-harness/wine-patches/*.patch 2>/dev/null || true) | shasum -a 256 | cut -c1-20)
          echo "key=ntdll-pe-sim-v2-$(k "$(t wine)" "$(t build/wine-pe)" "$MINGW" "$x" "$KEEP")" | tee -a "$GITHUB_OUTPUT"
      - name: "Cache: ntdll.dll"
        id: c
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/arm64ec-windows/ntdll.dll
      - name: Build
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          brew install bison flex
          mkdir -p toolchains
          curl -fsSL --retry 3 -o "toolchains/$MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW.tar.xz"
          echo "$MINGW_SHA256  toolchains/$MINGW.tar.xz" | shasum -a 256 -c -
          tar -xJf "toolchains/$MINGW.tar.xz" -C toolchains
          git submodule update --init --depth 1 -- wine
          # patches: the build/wine-pe/patches to keep (name prefixes; null = all). The extra
          # patches go after them; build-ntdll.sh applies the directory in name order.
          if [ "$KEEP" != null ]; then
            for P in build/wine-pe/patches/*.patch; do
              b=$(basename "$P"); jq -e --arg b "$b" 'any(.[]; . as $k | $b | startswith($k))' <<<"$KEEP" >/dev/null || rm "$P"
            done
          fi
          for P in tests/sim-harness/wine-patches/*.patch; do
            [ -e "$P" ] && cp "$P" "build/wine-pe/patches/9$(basename "$P")"
          done
          ls build/wine-pe/patches/
          export PATH="$(brew --prefix)/opt/bison/bin:$(brew --prefix)/opt/flex/bin:$PATH"
          build/wine-pe/build-ntdll.sh
      - name: "Save: ntdll.dll"
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/arm64ec-windows/ntdll.dll
      - uses: actions/upload-artifact@v4
        with:
          name: ntdll-${{ matrix.key }}
          path: app/Madeira/arm64ec-windows/ntdll.dll
          if-no-files-found: error
          retention-days: 3

  harness:
    name: ${{ matrix.name }}
    needs: [plan, unix-sim, fex-ec, pe-ntdll]
    if: ${{ !cancelled() && needs.unix-sim.result == 'success' && needs.fex-ec.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VARIANT: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: "Cache: llvm-mingw"
        uses: actions/cache@v4
        with:
          key: mingw-${{ env.MINGW }}
          path: toolchains/${{ env.MINGW }}
      - name: Toolchain
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          if [ ! -x "toolchains/$MINGW/bin/x86_64-w64-mingw32-clang" ]; then
            mkdir -p toolchains
            curl -fsSL --retry 3 -o "toolchains/$MINGW.tar.xz" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW.tar.xz"
            echo "$MINGW_SHA256  toolchains/$MINGW.tar.xz" | shasum -a 256 -c -
            tar -xJf "toolchains/$MINGW.tar.xz" -C toolchains
            rm "toolchains/$MINGW.tar.xz"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: sim-libs
          path: sim-libs
      - uses: actions/download-artifact@v4
        with:
          name: xtajit64
          path: app/Madeira/arm64ec-windows
      # "ntdll": a key of plan.json's ntdll_builds (built by pe-ntdll); else the checked-in one.
      - uses: actions/download-artifact@v4
        if: matrix.ntdll
        with:
          name: ntdll-${{ matrix.ntdll }}
          path: app/Madeira/arm64ec-windows
      - name: Place the simulator libraries
        run: |
          set -euo pipefail
          cp sim-libs/app/*.a app/Madeira/
          mkdir -p toolchains/gnutls-ios/lib && cp sim-libs/gnutls/*.a toolchains/gnutls-ios/lib/
      - name: Guest test exes
        run: |
          set -euo pipefail
          for n in fib-x64 tfstep-x64 sehctx-x64 ersc-load-x64; do tests/x64/build.sh "$n" | tail -1; done
          "toolchains/$MINGW/bin/x86_64-w64-mingw32-clang" -O2 -shared \
            -o app/Madeira/arm64ec-windows/steam_api64.dll tests/x64/steam_api64-stub.c
          # "ersc-load-x64 inject" starts this copy as the game.
          cp app/Madeira/arm64ec-windows/ersc-load-x64.exe app/Madeira/arm64ec-windows/eldenring.exe
          shasum -a 256 app/Madeira/arm64ec-windows/ntdll.dll app/Madeira/arm64ec-windows/xtajit64.dll
      # pe_release: ntdll.dll / xtajit64.dll (pe_files) as a release shipped them, from its Madeira.ipa.
      - name: PE binaries from a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          r=$(jq -r '.pe_release // empty' <<<"$VARIANT")
          [ -n "$r" ] || { echo "PE binaries from this checkout"; exit 0; }
          gh release download "$r" -R "$GITHUB_REPOSITORY" -p Madeira.ipa -D "$RUNNER_TEMP/ipa"
          for f in $(jq -r '(.pe_files // ["ntdll.dll", "xtajit64.dll"])[]' <<<"$VARIANT"); do
            m=$(unzip -Z1 "$RUNNER_TEMP/ipa/Madeira.ipa" | grep -E "^Payload/[^/]+\.app/arm64ec-windows/$f\$")
            unzip -o -j "$RUNNER_TEMP/ipa/Madeira.ipa" "$m" -d app/Madeira/arm64ec-windows >/dev/null
            echo "$f from $r: $(shasum -a 256 "app/Madeira/arm64ec-windows/$f" | cut -c1-16)"
          done
          strings -a app/Madeira/arm64ec-windows/xtajit64.dll | grep -m2 -E '20[0-9]{2}' | head -2 || true
      # Seamless Co-op's ersc.dll: a test input only, never committed here or bundled into a
      # release; fetched from its own repo (plan.json "ersc_builds") and checked against its hash.
      - name: ersc.dll
        env:
          TESTBIN_TOKEN: ${{ secrets.TESTBIN_TOKEN }}
        run: |
          set -euo pipefail
          v=$(jq -r '.ersc // empty' <<<"$VARIANT")
          [ -n "$v" ] || { echo "no ersc.dll for this variant"; exit 0; }
          url=$(jq -r --arg v "$v" '.ersc_builds[$v].url' tests/sim-harness/plan.json)
          sha=$(jq -r --arg v "$v" '.ersc_builds[$v].sha256' tests/sim-harness/plan.json)
          repo=$(jq -r --arg v "$v" '.ersc_builds[$v].repo // empty' tests/sim-harness/plan.json)
          if [ -n "$repo" ]; then
            # a build kept in a private repo: fetched with the read-only token
            tag=$(jq -r --arg v "$v" '.ersc_builds[$v].tag' tests/sim-harness/plan.json)
            GH_TOKEN="$TESTBIN_TOKEN" gh release download "$tag" -R "$repo" -p ersc.dll -D app/Madeira/arm64ec-windows --clobber
          else
            curl -fsSL --retry 3 -o app/Madeira/arm64ec-windows/ersc.dll "$url"
          fi
          echo "$sha  app/Madeira/arm64ec-windows/ersc.dll" | shasum -a 256 -c -
          echo "ersc.dll $v"
          # the mod's settings file, which ersc.dll reads next to itself (fatal error without it)
          cp tests/sim-harness/ersc_settings.ini app/Madeira/arm64ec-windows/ersc_settings.ini

      # The game's eldenring.exe for "inject" (started suspended, never resumed: ersc.dll only
      # scans its code). From a PRIVATE repo with a read-only token (secret TESTBIN_TOKEN),
      # checked against plan.json's sha256. Never committed, never part of an artifact.
      - name: Game exe (private)
        env:
          GH_TOKEN: ${{ secrets.TESTBIN_TOKEN }}
        run: |
          set -euo pipefail
          g=$(jq -r '.game_exe // empty' <<<"$VARIANT")
          [ -n "$g" ] || { echo "no game exe for this variant"; exit 0; }
          [ -n "$GH_TOKEN" ] || { echo "::error::secret TESTBIN_TOKEN is not set"; exit 1; }
          repo=$(jq -r --arg g "$g" '.game_builds[$g].repo' tests/sim-harness/plan.json)
          tag=$(jq -r --arg g "$g" '.game_builds[$g].tag' tests/sim-harness/plan.json)
          sha=$(jq -r --arg g "$g" '.game_builds[$g].sha256' tests/sim-harness/plan.json)
          gh release download "$tag" -R "$repo" -p eldenring.7z -D "$RUNNER_TEMP/game" --clobber
          command -v 7z >/dev/null || brew install --quiet p7zip
          7z x -y -o"$RUNNER_TEMP/game" "$RUNNER_TEMP/game/eldenring.7z" eldenring.exe >/dev/null
          echo "$sha  $RUNNER_TEMP/game/eldenring.exe" | shasum -a 256 -c -
          mv "$RUNNER_TEMP/game/eldenring.exe" app/Madeira/arm64ec-windows/eldenring.exe
          rm -rf "$RUNNER_TEMP/game"
          echo "eldenring.exe ($g) in place of the loader's copy"

      - name: Build the harness
        run: tests/sim-harness/build.sh
      - name: Boot the simulator
        run: tests/sim-harness/boot.sh

      - name: Run
        id: run
        continue-on-error: true
        run: |
          T=$(jq -r '.timeout // 240' <<<"$VARIANT")
          # The variant's madeira.cfg (cfg_preset: a GameRecommendations.swift entry, as a device applies it).
          DOCS="$HOME/Library/Developer/CoreSimulator/Devices/$(cat tests/sim-harness/out/udid)/data/Documents"
          python3 tests/sim-harness/make_cfg.py app/Madeira/GameRecommendations.swift "$DOCS/madeira.cfg"
          while IFS= read -r kv; do [ -n "$kv" ] && export "SIMCTL_CHILD_$kv"; done \
            < <(jq -r '(.env // {}) | to_entries[] | "\(.key)=\(.value)"' <<<"$VARIANT")
          RC=0
          while IFS= read -r line; do
            set -- $line; e=$1; shift
            r=0; SIM_TIMEOUT=$T tests/sim-harness/run.sh "$e" "$@" || r=$?
            echo "--- $line: exit $r"
            [ $r = 0 ] || RC=1
          done < <(jq -r '.run[]' <<<"$VARIANT")
          exit $RC
      - name: Host symbols
        if: always()
        run: |
          B=tests/sim-harness/out/MadeiraSim.app/madeira-sim
          [ -f "$B" ] || exit 0
          nm -n "$B" > tests/sim-harness/out/logs/madeira-sim.nm || true
          otool -l "$B" | grep -A9 -E 'LC_SEGMENT_64' > tests/sim-harness/out/logs/madeira-sim.segments || true
      - name: Digest
        if: always()
        run: python3 tests/sim-harness/digest.py tests/sim-harness/out/logs app/Madeira/arm64ec-windows "toolchains/$MINGW/bin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-logs-${{ matrix.name }}
          path: |
            tests/sim-harness/out/logs
            tests/sim-harness/out/stubs.txt
            tests/sim-harness/out/link.err
            tests/sim-harness/out/renamed.txt
            tests/sim-harness/out/obj/*.err
            app/Madeira/arm64ec-windows/xtajit64.dll
            app/Madeira/arm64ec-windows/ntdll.dll
            tests/sim-harness/out/MadeiraSim.app/madeira-sim
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if the run failed
        if: steps.run.outcome != 'success'
        run: exit 1
