# Builds Madeira into a sideloadable (unsigned) IPA and publishes it as a
# GitHub Release, together with a SideStore/AltStore source feed so the build
# can be installed and updated from inside the sideloader.
#
# Pushing to the default branch releases as build-N; pushing a v* tag releases
# under that tag. A manual branch run uploads an IPA artifact only by default;
# set publish_release to also publish a release and update the source feed.
#
# Three jobs: LLVM for iOS (hours, so built once and cached), the app (every
# native libraries, then Xcode), and the Pages site. The ARM64 Windows DLL
# farms are committed; the i386 WoW64 DLL farm is built from pinned Wine and
# DXMT sources and bundled in the IPA. The native D3D12 runtime and x64
# emulator xtajit64.dll are also rebuilt from source.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even when the app did not change"
        type: boolean
        default: false
      publish_release:
        description: "Publish a GitHub Release and update the SideStore feed (leave off for branch builds)"
        type: boolean
        default: false

permissions:
  contents: write
  # Read-only, purely to ask whether Pages is serving; see the feed step.
  pages: read

env:
  # Generated files follow the ref being built; a tag build writes to the
  # default branch, since a tag is not a place to commit to.
  TARGET_BRANCH: >-
    ${{ github.ref_type == 'tag'
        && github.event.repository.default_branch
        || github.ref_name }}
  MINGW: llvm-mingw-20260421-ucrt-macos-universal
  MINGW_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  FREETYPE_TAG: VER-2-13-3

concurrency:
  # A newer build supersedes whatever is still running on the same ref, since
  # those race to commit the feed to one branch. The ref is used fully
  # qualified so a branch and a tag of the same name stay apart.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Repository is public
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop while the repository is private
        run: |
          # macOS minutes are free only for public repositories, and a private
          # repository's raw URLs and releases are not reachable by SideStore.
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::This repository is private. Make it public (Settings -> General -> Danger Zone -> Change visibility), then run the workflow again."
            exit 1
          fi
          echo "public: building"

  llvm:
    name: LLVM for iOS
    needs: public
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Cached?
        id: cache
        uses: actions/cache@v4
        with:
          # Only whether it exists; the build job restores it when DXMT needs it.
          lookup-only: true
          # Bump v1 to rebuild LLVM; the key also changes with its script.
          key: llvm-15.0.7-ios-v1-${{ hashFiles('.github/scripts/build_llvm_ios.sh') }}
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib

      - name: Build LLVM 15.0.7 for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          .github/scripts/build_llvm_ios.sh

  build:
    name: Build and release
    needs: [public, llvm]
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      published: ${{ steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          # Newest Xcode on the image, so the app is built against the newest
          # iOS SDK the runner has.
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          sw_vers
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          TARGET=$(sed -n 's/.*IPHONEOS_DEPLOYMENT_TARGET = \([0-9.]*\);.*/\1/p' \
            app/Madeira.xcodeproj/project.pbxproj | sort -V | tail -1)
          echo "iOS SDK: $SDK, deployment target: $TARGET"
          # A deployment target above the installed SDK fails deep inside the
          # build with an opaque message; say what is actually wrong here.
          if [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | head -1)" != "$TARGET" ]; then
            echo "::error::Deployment target $TARGET is newer than the installed iOS SDK $SDK."
            exit 1
          fi
          echo "MIN_OS=$TARGET" >> "$GITHUB_ENV"

      - name: Has the app changed since the last release?
        id: appcheck
        run: |
          set -euo pipefail
          # Only what ends up inside the IPA: the app, the build scripts, the
          # pinned submodule commits and this workflow's own scripts. A README
          # or feed edit deliberately does not force a rebuild.
          STAMP=$( {
            for p in app build madeira-d3d12 madeira-oodle FEX wine dxmt madeira-dock; do
              git rev-parse "HEAD:$p"
            done
            git rev-parse HEAD:.github/scripts HEAD:.github/workflows
          } | shasum -a 256 | cut -d' ' -f1 )
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Building: tag push or forced."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f .build-stamp ] && [ "$(cat .build-stamp)" = "$STAMP" ]; then
            echo "App unchanged since the last release; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "App changed; building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish a release
        if: steps.appcheck.outputs.skip != 'true'
        id: publication
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Branch build: the IPA will be a run artifact, with no release or feed update."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release build: publish the IPA and update the source feed."
          fi

      # ------------------------------------------------------------- caches
      # Every native library is cached under a key made from exactly what goes
      # into it: its build scripts, the pinned submodule commit and the keys of
      # what it compiles against. A change to the app's own code reuses all of
      # them and goes straight to Xcode. Each cache is saved as soon as its
      # step succeeds, so a later failure never throws finished work away.
      - name: Cache keys
        if: steps.appcheck.outputs.skip != 'true'
        id: keys
        env:
          LLVM_KEY: llvm-15.0.7-ios-v1-${{ hashFiles('.github/scripts/build_llvm_ios.sh') }}
        run: |
          set -euo pipefail
          V=v1  # bump to drop every native cache at once
          k() { printf '%s\n' "$@" | shasum -a 256 | cut -c1-20; }
          t() { git rev-parse "HEAD:$1"; }
          GNUTLS="gnutls-$V-$(k "$(t build/gnutls-ios)")"
          FFMPEG="ffmpeg-$V-$(k "$(t build/ffmpeg)")"
          FREETYPE="freetype-$V-$(k "$(t build/freetype-ios)" "$FREETYPE_TAG")"
          FEX="fex-$V-$(k "$(t FEX)" "$(t build/fex-ios)")"
          # The Wine unix sides also read the shared crypto, HID and madsync
          # code, madeira_cfg.h and Winios' gamepad headers, plus the GnuTLS,
          # FFmpeg and FreeType they compile against.
          WINE="wine-$V-$(k "$(t wine)" "$(t build/ntdll-unix)" "$(t build/wineserver)" \
            "$(t build/win32u-unix)" "$(t build/crypto-unix)" "$(t build/madsync)" \
            "$(t build/hidpad)" "$(t build/madeira_cfg.h)" "$(t app/Madeira/Winios)" \
            "$(git hash-object .github/scripts/configure_wine.sh)" "$GNUTLS" "$FFMPEG" "$FREETYPE")"
          DXMT="dxmt-$V-$(k "$(t dxmt)" "$(t build/dxmt-ios)" "$(t build/madeira-d3d12)" \
            "$(t build/madeira_cfg.h)" "$(t madeira-d3d12)" "$(t app/Madeira/d3d12)" "$LLVM_KEY")"
          WOW64="wow64-$V-$(k "$(t wine)" "$(t dxmt)" "$(t build/wine-i386)" "$(t build/d3d8to9)" "$MINGW")"
          PAIRING="pairing-$V-$(k "$(t build/rppairing-ios)")"
          DOCK="dock-$V-$(k "$(t madeira-dock)" "$(t build/madeira-dock)" "$MINGW")"
          FEXEC="fexec-$V-$(k "$(t FEX)" "$(t build/fex-arm64ec)" "$MINGW")"
          VCRT="vcruntime-$V-$(k "$(git hash-object .github/scripts/fetch_vcruntime.sh)")"
          MONO="winemono-$V-$(k "$(t build/wine-mono)")"
          {
            echo "gnutls=$GNUTLS"; echo "ffmpeg=$FFMPEG"; echo "freetype=$FREETYPE"
            echo "fex=$FEX"; echo "wine=$WINE"; echo "dxmt=$DXMT"
            echo "wow64=$WOW64"
            echo "pairing=$PAIRING"; echo "dock=$DOCK"; echo "vcrt=$VCRT"; echo "mono=$MONO"
            echo "fexec=$FEXEC"
            echo "llvm=$LLVM_KEY"
          } | tee -a "$GITHUB_OUTPUT"

      - name: FEX source
        if: steps.appcheck.outputs.skip != 'true'
        # Before the caches: the FEX cache restores into this submodule's
        # folder, and git only checks a submodule out into an empty one.
        # Always needed, since Xcode compiles against FEX's headers.
        run: git submodule update --init --recursive --depth 1 --jobs 4 -- FEX

      - name: "Cache: GnuTLS"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-gnutls
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.gnutls }}
          path: toolchains/gnutls-ios

      - name: "Cache: FFmpeg"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-ffmpeg
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.ffmpeg }}
          path: |
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a

      - name: "Cache: FreeType"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-freetype
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.freetype }}
          path: build/freetype-ios/build/libfreetype.a

      - name: "Cache: FEX"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-fex
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.fex }}
          path: |
            FEX/build-ios
            !FEX/build-ios/**/CMakeFiles/**
            !FEX/build-ios/**/*.o

      - name: "Cache: Wine unix side"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-wine
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.wine }}
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a

      - name: "Cache: DXMT"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-dxmt
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.dxmt }}
          path: app/Madeira/libdxmt_combined.a

      - name: "Cache: WoW64 i386 DLL farm"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-wow64
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.wow64 }}
          path: app/Madeira/i386-windows

      - name: "Cache: in-app pairing"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-pairing
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.pairing }}
          path: |
            app/Madeira/libmadeira_rppairing.a
            app/Madeira/legal/LICENSES-rppairing-crates.txt

      - name: "Cache: Madeira Dock"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-dock
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.dock }}
          path: |
            app/Madeira/arm64ec-windows/dockhost.exe
            app/Madeira/arm64ec-windows/dock-notices.txt

      - name: "Cache: FEX ARM64EC"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-fexec
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.fexec }}
          path: app/Madeira/arm64ec-windows/xtajit64.dll

      - name: "Cache: Visual C++ runtime"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-vcrt
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.vcrt }}
          path: |
            app/Madeira/x86_64-vcruntime
            app/Madeira/i386-vcruntime

      - name: "Cache: Wine Mono"
        if: steps.appcheck.outputs.skip != 'true'
        id: c-mono
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.mono }}
          path: build/wine-mono/wine-mono-*

      - name: "Cache: Xcode compilation cache"
        if: steps.appcheck.outputs.skip != 'true'
        # Content-addressed (Xcode 26), so the newest one is always usable.
        uses: actions/cache/restore@v4
        with:
          key: xcode-cas-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xcode-cas-v1-
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex

      # --------------------------------------------------------- sources/tools
      - name: Other submodules
        if: steps.appcheck.outputs.skip != 'true'
        env:
          NEED_WINE: ${{ steps.c-wine.outputs.cache-hit != 'true' }}
          NEED_DXMT: ${{ steps.c-dxmt.outputs.cache-hit != 'true' }}
          NEED_WOW64: ${{ steps.c-wow64.outputs.cache-hit != 'true' }}
          NEED_DOCK: ${{ steps.c-dock.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # Only when their native library or the WoW64 farm has to be built;
          # Wine alone is large.
          MODS=()
          if [ "$NEED_WINE" = true ] || [ "$NEED_WOW64" = true ]; then MODS+=(wine); fi
          if [ "$NEED_DXMT" = true ] || [ "$NEED_WOW64" = true ]; then MODS+=(dxmt); fi
          # madeira-dock is part of this repository: nothing to fetch for it ($NEED_DOCK).
          if [ ${#MODS[@]} -gt 0 ]; then
            echo "fetching: ${MODS[*]}"
            git submodule update --init --recursive --depth 1 --jobs 4 -- "${MODS[@]}"
          else
            echo "all cached; no other submodule needed"
          fi
          git submodule status

      - name: Stamp version
        if: steps.appcheck.outputs.skip != 'true'
        id: version
        run: |
          set -euo pipefail
          PBX=app/Madeira.xcodeproj/project.pbxproj
          BASE=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' "$PBX" | head -1)
          BUNDLE_ID=$(sed -n 's/.*MADEIRA_BUNDLE_IDENTIFIER = \([^;]*\);.*/\1/p' "$PBX" | head -1)
          # Monotonic last component so SideStore can tell builds apart and
          # offer updates. Passed to xcodebuild; the project is left untouched.
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($BUNDLE_ID)"

      - name: Host tools
        if: steps.appcheck.outputs.skip != 'true'
        env:
          NEED_WINE: ${{ steps.c-wine.outputs.cache-hit != 'true' }}
          NEED_FREETYPE: ${{ steps.c-freetype.outputs.cache-hit != 'true' }}
          NEED_DOCK: ${{ steps.c-dock.outputs.cache-hit != 'true' }}
          NEED_FEXEC: ${{ steps.c-fexec.outputs.cache-hit != 'true' }}
          NEED_PAIRING: ${{ steps.c-pairing.outputs.cache-hit != 'true' }}
          NEED_VCRT: ${{ steps.c-vcrt.outputs.cache-hit != 'true' }}
          NEED_WOW64: ${{ steps.c-wow64.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # Only what the builds that are not cached need.
          PKGS=()
          # bison/flex for Wine's configure (macOS ships bison 2.3), gnutls and
          # freetype so that configure enables the modules that use them.
          [ "$NEED_WINE" = true ] && PKGS+=(bison flex gnutls freetype pkgconf)
          [ "$NEED_WOW64" = true ] && PKGS+=(bison flex meson)
          [ "$NEED_VCRT" = true ] && PKGS+=(sevenzip)
          [ ${#PKGS[@]} -eq 0 ] || brew install "${PKGS[@]}"

          if [ "$NEED_PAIRING" = true ]; then
            command -v rustup >/dev/null || {
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.cargo/bin:$PATH"
            }
            rustup target add aarch64-apple-ios
          fi

          # Always: the app's own .metal files need it too. Xcode 26 ships the
          # Metal compiler as a separate component.
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
          if [ "$NEED_WOW64" = true ]; then
            command -v ninja >/dev/null || brew install ninja
          fi

          # The D3D12 PE runtime is rebuilt for every release, including runs
          # whose Wine, Dock and FEX native libraries were all cached.
          mkdir -p toolchains
          curl -fsSL --retry 3 -o "toolchains/$MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$MINGW.tar.xz"
          echo "$MINGW_SHA256  toolchains/$MINGW.tar.xz" | shasum -a 256 -c -
          tar -xJf "toolchains/$MINGW.tar.xz" -C toolchains
          rm "toolchains/$MINGW.tar.xz"

          # build/freetype-ios/build.sh and the win32u/dwrite unix sides read it here.
          if [ "$NEED_WINE" = true ] || [ "$NEED_FREETYPE" = true ]; then
            git clone -q --depth 1 --branch "$FREETYPE_TAG" https://github.com/freetype/freetype.git research/freetype
          fi

      - name: LLVM for iOS (from the cache)
        if: steps.appcheck.outputs.skip != 'true' && steps.c-dxmt.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.llvm }}
          fail-on-cache-miss: true
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib

      # ----------------------------------------------------- native libraries
      - name: Licence copies
        if: steps.appcheck.outputs.skip != 'true'
        run: build/stage-licenses.sh

      # GnuTLS and FreeType are only inputs to the Wine unix side.
      - name: GMP, Nettle, GnuTLS
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true' && steps.c-gnutls.outputs.cache-hit != 'true'
        run: build/gnutls-ios/build.sh
      - name: "Save: GnuTLS"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true' && steps.c-gnutls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.gnutls }}
          path: toolchains/gnutls-ios

      - name: FFmpeg
        if: steps.appcheck.outputs.skip != 'true' && steps.c-ffmpeg.outputs.cache-hit != 'true'
        run: build/ffmpeg/build.sh
      - name: "Save: FFmpeg"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.ffmpeg }}
          path: |
            toolchains/ffmpeg-ios
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a

      - name: FreeType
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true' && steps.c-freetype.outputs.cache-hit != 'true'
        run: build/freetype-ios/build.sh
      - name: "Save: FreeType"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true' && steps.c-freetype.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.freetype }}
          path: build/freetype-ios/build/libfreetype.a

      - name: FEX
        if: steps.appcheck.outputs.skip != 'true' && steps.c-fex.outputs.cache-hit != 'true'
        run: build/fex-ios/build.sh
      - name: "Save: FEX"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-fex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.fex }}
          path: |
            FEX/build-ios
            !FEX/build-ios/**/CMakeFiles/**
            !FEX/build-ios/**/*.o

      - name: Wine (configure)
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true'
        run: .github/scripts/configure_wine.sh
      - name: Wine (unix side)
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          build/ntdll-unix/build.sh
          # wineserver's build wants llvm-objcopy; llvm-mingw carries one. Appended,
          # so it never shadows the Xcode tools.
          PATH="$PATH:$PWD/toolchains/$MINGW/bin" build/wineserver/build.sh
          build/win32u-unix/build.sh
          ls -l app/Madeira/libntdll_unix.a app/Madeira/libwineserver.a app/Madeira/libwin32u_unix.a
      - name: "Save: Wine unix side"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.wine }}
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a

      - name: DXMT
        if: steps.appcheck.outputs.skip != 'true' && steps.c-dxmt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          build/dxmt-ios/build.sh
          # The archive the app links: DXMT's objects plus the LLVM libraries
          # (build/dxmt-ios/README.md).
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a
          ls -lh app/Madeira/libdxmt_combined.a
      - name: "Save: DXMT"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-dxmt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.dxmt }}
          path: app/Madeira/libdxmt_combined.a

      # The i386 PE farm is a folder resource in the app bundle. Build it from
      # the pinned Wine and DXMT submodules when the source-keyed cache misses;
      # the Xcode build below then embeds it in the IPA.
      - name: WoW64 i386 farm (Wine + DXMT)
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wow64.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          build/wine-i386/build.sh 2>&1 | tee wow64-build.log
          test -s app/Madeira/i386-windows/ntdll.dll
          test -s app/Madeira/i386-windows/kernel32.dll
          test -s app/Madeira/i386-windows/user32.dll
          test -s app/Madeira/i386-windows/comctl32.dll
          grep -Eq '^== [0-9]+ files in app/Madeira/i386-windows, 0 missing imports ==$' wow64-build.log
          # Kept in the bundle: env.MADEIRA_EXE = hello-x86.exe is the on-device
          # smoke test of the 32-bit path (docs/WOW64.md, "Building", step 4).
          tests/x86/build.sh hello-x86
          toolchains/$MINGW/bin/i686-w64-mingw32-objdump -f app/Madeira/i386-windows/hello-x86.exe | grep -qi 'file format pe-i386'
          # d3d8.dll is d3d8to9 (native PE), not Wine's wined3d frontend.
          toolchains/$MINGW/bin/llvm-objdump -p app/Madeira/i386-windows/d3d8.dll | grep -q 'DLL Name: d3d9.dll'
          echo "Validated i386 Wine farm, d3d8to9 and the 32-bit PE smoke test."
      - name: "Save: WoW64 i386 DLL farm"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-wow64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.wow64 }}
          path: app/Madeira/i386-windows

      - name: Verify bundled WoW64 runtime
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for dll in ntdll.dll kernel32.dll user32.dll comctl32.dll; do
            test -s "app/Madeira/i386-windows/$dll" || { echo "Missing WoW64 builtin: $dll"; exit 1; }
          done
          for dll in ntdll.dll wow64.dll wow64win.dll xtajit.dll; do
            test -s "app/Madeira/aarch64-windows/$dll" || { echo "Missing ARM64 WoW64 support: $dll"; exit 1; }
          done
          count=$(find app/Madeira/i386-windows -maxdepth 1 -type f -name '*.dll' | wc -l | tr -d ' ')
          echo "WoW64 DLL farm contains $count DLLs."
          test "$count" -ge 100

      - name: D3D12 runtime (ARM64EC)
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- dxmt
          MAD_BUILD_ID="${GITHUB_SHA:0:12}" RUNTIME_ONLY=1 MAD_REQUIRE_KERNELS=1 \
            build/madeira-d3d12/build-pe.sh
          cp build/madeira-d3d12/out-pe/d3d12.dll app/Madeira/arm64ec-windows/d3d12.dll
          cp build/madeira-d3d12/out-pe/madeira_d3d12.dll app/Madeira/arm64ec-windows/madeira_d3d12.dll

      # madeira-oodle: a native oo2core_6_win64.dll (Wine builtin), loaded only by a game
      # config whose WINEDLLOVERRIDES has oo2core_6_win64=b. Validate the actual
      # decoder before packaging; an IPA without it must not be published.
      - name: Native Oodle decoder (ARM64EC)
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 tests/host/check-oodle-native.py --sanitize
          build/madeira-oodle/build-pe.sh
          cp build/madeira-oodle/out-pe/oo2core_6_win64.dll app/Madeira/arm64ec-windows/oo2core_6_win64.dll
          cp build/madeira-oodle/out-pe/oodle-notices.txt app/Madeira/arm64ec-windows/oodle-notices.txt

      - name: In-app pairing
        if: steps.appcheck.outputs.skip != 'true' && steps.c-pairing.outputs.cache-hit != 'true'
        run: build/rppairing-ios/build.sh
      - name: "Save: in-app pairing"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-pairing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.pairing }}
          path: |
            app/Madeira/libmadeira_rppairing.a
            app/Madeira/legal/LICENSES-rppairing-crates.txt

      - name: Madeira Dock
        if: steps.appcheck.outputs.skip != 'true' && steps.c-dock.outputs.cache-hit != 'true'
        run: build/madeira-dock/build.sh
      - name: "Save: Madeira Dock"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-dock.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.dock }}
          path: |
            app/Madeira/arm64ec-windows/dockhost.exe
            app/Madeira/arm64ec-windows/dock-notices.txt

      # The x64 emulator of 64-bit processes (FEX's ARM64EC module), built from
      # the pinned FEX with Madeira's patches in build/fex-arm64ec/patches. It
      # replaces the committed copy, which has none of them.
      - name: FEX ARM64EC (xtajit64.dll)
        if: steps.appcheck.outputs.skip != 'true' && steps.c-fexec.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          build/fex-arm64ec/build.sh
      - name: "Save: FEX ARM64EC"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-fexec.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.fexec }}
          path: app/Madeira/arm64ec-windows/xtajit64.dll

      # Required: a program built with MSVC that imports a runtime DLL Wine only
      # partly implements (or MFC, which Wine lacks) stops at once without it.
      - name: Visual C++ runtime
        if: steps.appcheck.outputs.skip != 'true' && steps.c-vcrt.outputs.cache-hit != 'true'
        id: vcrt
        run: |
          set -euo pipefail
          mkdir -p app/Madeira/x86_64-vcruntime app/Madeira/i386-vcruntime
          .github/scripts/fetch_vcruntime.sh
          N64=$(find app/Madeira/x86_64-vcruntime -name '*.dll' | wc -l | tr -d ' ')
          N32=$(find app/Madeira/i386-vcruntime -name '*.dll' | wc -l | tr -d ' ')
          echo "x64: $N64, x86: $N32"
          test "$N64" -ge 14 && test "$N32" -ge 13
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: "Save: Visual C++ runtime"
        if: steps.appcheck.outputs.skip != 'true' && steps.vcrt.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.vcrt }}
          path: |
            app/Madeira/x86_64-vcruntime
            app/Madeira/i386-vcruntime

      # .NET Framework programs run out of the box: the Xcode phase "Bundle
      # Wine Mono" copies build/wine-mono/wine-mono-<ver> into the app, and
      # WineProcessBridge.m links it as C:\windows\mono\mono-2.0 every session.
      - name: Wine Mono
        if: steps.appcheck.outputs.skip != 'true' && steps.c-mono.outputs.cache-hit != 'true'
        run: build/wine-mono/fetch.sh
      - name: "Save: Wine Mono"
        if: steps.appcheck.outputs.skip != 'true' && steps.c-mono.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.mono }}
          path: build/wine-mono/wine-mono-*

      # ------------------------------------------------------------------ app
      - name: Build
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p app/Madeira/x86_64-vcruntime app/Madeira/i386-vcruntime
          # COMPILATION_CACHE_ENABLE_CACHING: Xcode 26's content-addressed
          # compilation cache, restored above, so unchanged files are not
          # compiled again.
          .github/scripts/build_app.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}" \
            COMPILATION_CACHE_ENABLE_CACHING=YES 2>&1 | tee build.log
          grep -i 'compilation cache' build.log | tail -5 || true

      - name: "Save: Xcode compilation cache"
        if: always() && steps.appcheck.outputs.skip != 'true'
        id: cas
        run: |
          # Kept below 3 GB: past that, start over rather than let it grow forever.
          CAS="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          if [ -d "$CAS" ]; then
            MB=$(du -sm "$CAS" | cut -f1)
            echo "compilation cache: ${MB} MB"
            [ "$MB" -lt 3000 ] && echo "save=true" >> "$GITHUB_OUTPUT" || echo "too large; not saved"
          fi
      - name: "Save: Xcode compilation cache (upload)"
        if: always() && steps.cas.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          key: xcode-cas-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex

      - name: Package the IPA
        if: steps.appcheck.outputs.skip != 'true'
        id: package
        run: |
          set -euo pipefail
          .github/scripts/package_ipa.sh build/xcode/Debug-iphoneos/Madeira.app \
            app/Madeira/Madeira.entitlements Madeira.ipa
          python3 tests/host/check-oodle-pe.py --ipa Madeira.ipa \
            --source build/madeira-oodle/out-pe/oo2core_6_win64.dll
          echo "size=$(stat -f%z Madeira.ipa)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 Madeira.ipa | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "human_size=$(ls -lh Madeira.ipa | awk '{print $5}')" >> "$GITHUB_OUTPUT"

      - name: Verify WoW64 runtime is in the IPA
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          ipa = "Madeira.ipa"
          required = {
              "ntdll.dll", "kernel32.dll", "user32.dll", "comctl32.dll",
              "comdlg32.dll", "shell32.dll", "userenv.dll",
          }
          with zipfile.ZipFile(ipa) as z:
              names = set(z.namelist())
          prefix = "Payload/Madeira.app/i386-windows/"
          bundled = {name[len(prefix):].lower() for name in names if name.startswith(prefix)}
          missing = sorted(required - bundled)
          if missing:
              raise SystemExit("IPA is missing WoW64 resources: " + ", ".join(missing))
          dlls = [name for name in bundled if name.endswith(".dll")]
          if len(dlls) < 100:
              raise SystemExit(f"IPA contains only {len(dlls)} i386 DLLs")
          arm64_prefix = "Payload/Madeira.app/aarch64-windows/"
          arm64 = {name[len(arm64_prefix):].lower() for name in names if name.startswith(arm64_prefix)}
          missing_arm64 = sorted({"ntdll.dll", "wow64.dll", "wow64win.dll", "xtajit.dll"} - arm64)
          if missing_arm64:
              raise SystemExit("IPA is missing ARM64 WoW64 support: " + ", ".join(missing_arm64))
          def folder(sub):
              p = f"Payload/Madeira.app/{sub}/"
              return {n[len(p):].lower() for n in names if n.startswith(p) and not n.endswith("/")}
          vc64 = {f for f in folder("x86_64-vcruntime") if f.endswith(".dll")}
          vc32 = {f for f in folder("i386-vcruntime") if f.endswith(".dll")}
          if len(vc64) < 14 or len(vc32) < 13:
              raise SystemExit(f"IPA has {len(vc64)} x64 and {len(vc32)} x86 Visual C++ runtime DLLs (want 14 and 13)")
          mono = folder("wine-mono")
          if "bin/libmono-2.0-x86.dll" not in mono or "lib/mono/4.5/mscorlib.dll" not in mono:
              raise SystemExit("IPA is missing Wine Mono (wine-mono/bin/libmono-2.0-x86.dll, lib/mono/4.5/mscorlib.dll)")
          if "hello-x86.exe" not in bundled:
              raise SystemExit("IPA is missing the 32-bit smoke test hello-x86.exe")
          with zipfile.ZipFile(ipa) as z:
              d3d8 = z.read(prefix + "d3d8.dll")
          if b"Wine builtin DLL" in d3d8[:0x80]:
              raise SystemExit("i386 d3d8.dll is Wine's wined3d frontend, not d3d8to9")
          print(f"Verified {len(dlls)} i386 DLLs, {len(vc64)}+{len(vc32)} VC++ runtime DLLs, Wine Mono and d3d8to9 in {ipa}")
          PY

      - name: Determine release tag
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=Madeira ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=Madeira build #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA as run artifact
        if: steps.appcheck.outputs.skip != 'true'
        # Branch builds need this artifact; for releases the GitHub Release is
        # the durable distribution channel, so an artifact quota must not fail it.
        continue-on-error: ${{ steps.publication.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build the SideStore source feed
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        id: feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
          SIZE: ${{ steps.package.outputs.size }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The one-tap "Add to SideStore" button needs the Pages landing page.
          # It must not be advertised before Pages actually serves, so ask - and
          # on any doubt fall back to raw.githubusercontent.com, which needs
          # nothing switched on.
          PAGES_URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null || true)
          # With Pages off, gh prints its 404 body to stdout and that lands in
          # PAGES_URL. Anything that is not a URL means "no Pages".
          case "$PAGES_URL" in
            http://*|https://*) ;;
            *) PAGES_URL="" ;;
          esac
          export PAGES_URL
          echo "Pages: ${PAGES_URL:-not enabled}"
          sips -Z 512 app/Madeira/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png --out icon.png

          # StikDebug (formerly StikJIT), which enables Madeira's JIT, is listed
          # too: the IPA of its newest release, linked from its own release.
          # Best effort - without it the feed lists Madeira alone.
          if REL=$(gh api repos/StikDebug/StikDebug/releases/latest 2>/dev/null) \
             && STIK_URL=$(jq -re '[.assets[] | select(.name | endswith(".ipa"))][0].browser_download_url' <<<"$REL") \
             && curl -fsSL --retry 3 -o stikdebug.ipa "$STIK_URL"; then
            export STIK_IPA=stikdebug.ipa STIK_URL
            export STIK_DATE=$(jq -r '.published_at' <<<"$REL")
            export STIK_TAG=$(jq -r '.tag_name' <<<"$REL")
            echo "StikDebug: $STIK_TAG ($STIK_URL)"
          else
            echo "::warning::StikDebug's latest release has no IPA to list; the feed lists Madeira only."
          fi
          python3 .github/scripts/make_source.py .

      - name: Publish the release
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.tag.outputs.title }}
          VERSION: ${{ steps.version.outputs.version }}
          IPA_SIZE: ${{ steps.package.outputs.human_size }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          SOURCE_URL: ${{ steps.feed.outputs.source_url }}
          PAGES_URL: ${{ steps.feed.outputs.pages_url }}
        run: |
          set -euo pipefail
          # GitHub strips sidestore:// links from release bodies, so the one-tap
          # button only exists once Pages is serving the landing page.
          if [ -n "${PAGES_URL:-}" ]; then
            ADD_SOURCE="**[Add to SideStore](${PAGES_URL%/}/)**"
          else
            ADD_SOURCE="Add this source in SideStore: \`$SOURCE_URL\`"
          fi
          UPSTREAM=$(git log -1 --format='%h %s' HEAD)

          {
            printf '## Madeira %s\n\n' "$VERSION"
            printf 'Windows PC games on iPhone and iPad, built from `%s`.\n\n' "$UPSTREAM"
            printf '### Install\n\n'
            printf '%s\n\n' "$ADD_SOURCE"
            printf 'Or download `Madeira.ipa` and install it with SideStore, AltStore or Sideloadly.\n'
            printf 'Then enable JIT in Madeira (Settings -> JIT; on iOS 27 it can pair the device itself).\n\n'
            printf '### Build\n\n'
            printf -- '- Debug configuration (the one that runs games)\n'
            printf -- '- IPA: %s · SHA-256 `%s`\n' "$IPA_SIZE" "$SHA256"
            printf -- '- Unsigned; sideloaders re-sign on install.\n'
          } > notes.md
          cat notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" Madeira.ipa --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" Madeira.ipa --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file notes.md
          fi

      - name: Commit the source feed
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        # Committed rather than deployed with actions/deploy-pages: the Actions
        # token may not create the Pages site itself. This makes the feed
        # reachable over raw.githubusercontent.com immediately, and over Pages
        # as soon as Pages is switched on for the branch. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # The stamp rides along with the feed: both describe the release that
          # was just published.
          echo "${{ steps.appcheck.outputs.stamp }}" > .build-stamp
          .github/scripts/commit_generated.sh \
            "Update source feed for ${{ steps.tag.outputs.tag }}" \
            s.json apps.json icon.png stikdebug-icon.png index.html .build-stamp

      - name: Stage the Pages site
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html s.json apps.json icon.png _site/
          [ ! -f stikdebug-icon.png ] || cp stikdebug-icon.png _site/
          ls -l _site

      - name: Hand the site to the Pages job
        if: steps.appcheck.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: madeira-pages
          path: _site
          if-no-files-found: error
          retention-days: 1

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          cp build.log logs/ 2>/dev/null || true
          find build -path '*/obj/*' \( -name '*.err' -o -name '*.log' -o -name 'err-*' \) -size +0 \
            -exec cp {} logs/ \; 2>/dev/null || true
          cp wine/build-macos/config.log wine/build-macos/*.out logs/ 2>/dev/null || true
          ls logs

      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs
          if-no-files-found: ignore

  pages:
    name: Publish the SideStore source to Pages
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one outright, so the
      # scopes the actions in this job need are all listed here: actions:read
      # for pulling the artifact the build job left behind, pages+id-token for
      # the deployment itself.
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Enable Pages if it is not on yet
        id: configure
        # GitHub's own Actions token may not CREATE a Pages site - that needs
        # repository-admin rights, so it answers "Resource not accessible by
        # integration" until Pages has been switched on once by hand. Once the
        # site exists this step simply finds it. A repository without Pages is
        # not a broken build, so the job reports what to switch on and stays
        # green: the feed is committed to the branch either way and stays
        # reachable over raw.githubusercontent.com.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/download-artifact@v4
        if: steps.configure.outcome == 'success'
        with:
          name: madeira-pages
          path: _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: _site

      - name: Deploy
        id: deploy
        if: steps.configure.outcome == 'success'
        # Pages set to "Deploy from a branch" rejects a workflow deployment.
        # That is a working setup too - it serves the committed feed directly -
        # so it must not fail the build either.
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Where the source lives
        env:
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/s.json
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            PAGE="${{ steps.deploy.outputs.page_url }}"
            echo "Pages:  $PAGE"
            echo "Source: ${PAGE}s.json"
            echo "::notice::SideStore source: ${PAGE}s.json"
          else
            SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            echo "::warning::GitHub Pages is not set up yet. Once, under Settings -> Pages, set Source to 'GitHub Actions'; the SideStore source will then be at ${SITE}/s.json. Until then it works unchanged at ${RAW_URL}"
            echo "Source (without Pages): $RAW_URL"
          fi
