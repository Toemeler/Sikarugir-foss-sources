name: Config catalog
# Regenerates app/Madeira/ConfigCatalog.generated.swift on Linux (the generator
# is not run on Windows) and uploads it; nothing is committed here. A push
# that changes this file or the generator runs it (dispatch needs the default branch);
# touch this line to regenerate after a key or its comment changed (ui-scale lists).
on:
  workflow_dispatch:
  push:
    branches: [codex/elden-ring-native-oodle-20261017]
    paths: [.github/workflows/config-catalog.yml, build/tools/gen-config-catalog.py]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the generator scans
        run: git submodule update --init --depth 1 --jobs 4 -- FEX wine dxmt
      - name: Regenerate
        run: |
          set -euo pipefail
          python3 build/tools/gen-config-catalog.py
          git diff --stat -- app/Madeira/ConfigCatalog.generated.swift
          python3 build/tools/gen-config-catalog.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: config-catalog
          path: app/Madeira/ConfigCatalog.generated.swift
